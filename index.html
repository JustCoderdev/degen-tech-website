<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" type="text/css" href="style.css" />

<title>DegenTech</title>
</head>

<body class="tint-blue">
<header>
	<span>Index</span>

	<div class="spacer"></div>

	<a href="about-us.html" target="_self">About us</a>
	<a href="lectures.html" target="_self">Lectures</a>
</header>

<main>
	<div class="center-text">
		<img src="assets/degentech-logo.png" alt="Degen tech logo">
		<h1> DegenTech Inc. </h1>
		<p>  We are a network of working professional furries interested in STEMM </p>
	</div>

	<nav class="socials">
		<a href="https://bsky.app/profile/degentechinc.bsky.social" target="_blank">
			<img src="assets/bluesky-logo.svg" alt="Bluesky logo">
		</a>
		<a href="https://x.com/degentechinc" target="_blank">
			<img src="assets/x-logo.svg" alt="X logo">
		</a>
		<a href="https://www.youtube.com/@degentech" target="_blank">
			<img src="assets/youtube-logo.svg" alt="Youtube logo">
		</a>
		<a href="https://discord.gg/dgtc" target="_blank">
			<img src="assets/discord-logo.svg" alt="Discord logo">
		</a>
	</nav>

</main>

</body>

<style>
main
{
	flex-basis: 100%;

	display: flex;
	align-items: center;
	flex-direction: column;
	justify-content: space-around;
}

div.center-text
{
	display: flex;
	justify-content: center;
	align-items: center;
	flex-direction: column;

	gap: 1rem;
}

div.center-text > img
{
	width: 40%;
	max-width: 10rem;
	aspect-ratio: 1;
	filter: drop-shadow(0px 0px 40mm rgba(255, 255, 255, .4));
}

div.center-text > h1
{
	margin: 0;
}

div.center-text > p
{
	max-width: 40ch;
	text-align: center;

	color: var(--fg-secondary);
}

nav.socials
{
	padding: 1rem;

	transition: .8s;
	display: flex;
	align-items: center;
	justify-content: center;

	gap: 2rem;
}

nav.socials > a
{
	width: 3rem;
	height: 3rem;

	background-color: var(--bg-secondary);
	transform: rotate(45deg);

	display: flex;
	align-items: center;
	justify-content: center;

	transition: .4s;
}

nav.socials > a:hover
{
	box-shadow: 0px 0px 30px -3px rgba(255, 255, 255, .2);
	transition: .2s;
}

nav.socials > a > img
{
	height: 1.5rem;
	transform: rotate(-45deg);
	filter: brightness(40%);

	transition: .4s;
}


nav.socials > a:hover > img
{
	filter: brightness(100%);
	transition: .2s;
}

</style>

</html>
